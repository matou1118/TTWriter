[package]
name = "wordcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft command line: convert, inspect, render, run commands, MCP server"

[[bin]]
name = "wordcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-mcp = { workspace = true }
wordcraft-zotero = { workspace = true }
wordcraft-pdfedit = { workspace = true }
serde_json = { workspace = true }
# The update check verifies the downloaded installer against the release manifest's SHA-256.
sha2 = { workspace = true }
# AtomGit's contents API returns the release manifest base64-encoded.
base64 = { workspace = true }
# The update check's cache lives in the settings folder (shared with the control key).
wordcraft-control-key = { workspace = true }
sys-locale = "0.3"
