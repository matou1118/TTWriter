      - name: validate every SKILL.md
        run: |
          for s in skills/*/SKILL.md; do
            echo "::group::$s"
            python3 tools/validate_skill.py "$s"
            echo "::endgroup::"
          done
      - name: scripts are syntactically valid Python
        run: python3 -m compileall -q skills/
