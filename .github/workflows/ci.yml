jobs:
  checks:
    name: fmt · assets · layers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: every asset has an ATTRIBUTION.md row
        run: cargo xtask assets
      - name: layering (nothing below L6 depends on the UI)
        run: cargo xtask layers

  skills:
    name: skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
