name: CI

# 快速门禁：craft-common-actions 的共享 gate（fmt/clippy/test/wasm 全家），加上本仓库特有的
# 技能校验（13 个 SKILL.md + Python 脚本语法）。
#
# 完整说明见 `cargo xtask ci` 与 CONTRIBUTING.md。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
        libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers

  skills:
    name: skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: validate every SKILL.md
        run: |
          for s in skills/*/SKILL.md; do
            echo "::group::$s"
            python3 tools/validate_skill.py "$s"
            echo "::endgroup::"
          done
      - name: scripts are syntactically valid Python
        run: python3 -m compileall -q skills/
