name: Pages

# 官网（GitHub Pages）+ 网页版蜻蜓文档（wordcraft-web，完整 egui 界面编译到 wasm，
# 落在 /app/ 路径）。一个工作流一次部署，两个产物一起组装——GitHub Pages 一次只保留
# 一个 deployment，分成两个工作流会互相顶掉。
#
# 截图仍只有 docs/images/ 一份，发布时拷进来，免得同一张图在仓库里存两遍。
# 网页版只在 tag（v*）与手动触发时重编（一次 wasm 构建约 10 分钟）；纯 site/ 文案
# 改动复用上一次的 app（缓存没命中就照常重编——跳过会发布一个没有 /app/ 的站点）。

on:
  push:
    branches: [main, master]
    paths: ["site/**", "docs/images/**", "assets/app-icon/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # ---- 网页版（/app/）：release 发布或手动触发才重编，平时复用 -----------------
      # Pages 每次 deployment 整站替换，所以 site-only 改动也要把上次的 app 带上：
      # dist/web 按代码哈希缓存（Cargo.lock + wordcraft-web 源码没变 → 缓存命中）。
      - name: restore the last built app
        id: appcache
        uses: actions/cache/restore@v4
        with:
          path: dist/web
          key: webapp-${{ hashFiles('Cargo.lock', 'apps/wordcraft-web/src/**', 'apps/wordcraft-web/index.html', 'apps/wordcraft-web/Trunk.toml') }}

      # A Pages deployment replaces the whole site, so "reuse the cached app" is only safe when
      # the cache actually hit - a miss without a build would publish a site with no /app/.
      - name: should the web app be rebuilt?
        id: webapp
        run: |
          if [[ "${{ github.event_name }}" == "release" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.appcache.outputs.cache-hit }}" != "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: install wasm target
        if: steps.webapp.outputs.build == 'true'
        run: rustup target add wasm32-unknown-unknown

      - name: install trunk
        if: steps.webapp.outputs.build == 'true'
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "v0.21.14"

      # 中文字体（craft-fonts，可选构建输入）：不嵌的话网页版中文界面全是问号——
      # 浏览器里 queryLocalFonts 极少被授予，wasm 里必须自带 Hans 字形。
      - name: check out craft-fonts (the CJK faces for the web app)
        if: steps.webapp.outputs.build == 'true'
        uses: actions/checkout@v5
        with:
          repository: storytold/craft-fonts
          path: craft-fonts

      - name: build the web app
        if: steps.webapp.outputs.build == 'true'
        working-directory: apps/wordcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: trunk build --release

      - name: save the built app for site-only redeployments
        if: steps.webapp.outputs.build == 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/web
          key: webapp-${{ hashFiles('Cargo.lock', 'apps/wordcraft-web/src/**', 'apps/wordcraft-web/index.html', 'apps/wordcraft-web/Trunk.toml') }}

      - name: assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/images _site/icon
          cp -r docs/images/. _site/images/
          cp assets/app-icon/hicolor/256x256/apps/ai.storyteller.wordcraft.png _site/icon/icon.png
          cp assets/app-icon/wordcraft.svg _site/icon/icon.svg
          rm -f _site/README.md
          if [[ "${{ steps.webapp.outputs.build }}" == "true" || "${{ steps.appcache.outputs.cache-hit }}" == "true" ]]; then
            mkdir -p _site/app
            cp -r dist/web/. _site/app/
            # PWA assets (same list as apps/wordcraft-web/build-web.ps1; trunk's
            # copy-file pipeline writes 1-byte stubs on 0.21.14, so plain cp here):
            cp apps/wordcraft-web/manifest.json _site/app/
            cp apps/wordcraft-web/sw.js _site/app/
            cp assets/app-icon/hicolor/512x512/apps/ai.storyteller.wordcraft.png _site/app/wordcraft-icon-512.png
            cp assets/app-icon/hicolor/256x256/apps/ai.storyteller.wordcraft.png _site/app/wordcraft-icon-256.png
            cp assets/app-icon/hicolor/128x128/apps/ai.storyteller.wordcraft.png _site/app/wordcraft-icon-128.png
            cp assets/app-icon/wordcraft.svg _site/app/
          fi
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
