name: 功能建议
description: 希望中文层多支持点什么
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先看一眼 [README](../blob/master/README.md) 的「已知限制」和 [CHANGELOG](../blob/master/CHANGELOG.md)，
        免得提了已经写明没做的事。

        **属于通用改进的**（任何 Word 用户都受益，不限于中文），也欢迎顺手提到上游
        [storytold/wordcraft](https://github.com/storytold/wordcraft)。

  - type: textarea
    id: problem
    attributes:
      label: 你想做什么
      description: 说场景，别急着说方案。你现在是怎么凑合的？
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 属于哪一块
      multiple: true
      options:
        - 中文排版规范（公文 / 论文 / 法务）
        - 中文字体处理
        - 中文字数 / 统计
        - 简繁转换、拼音排序等中文工具
        - 排版技能（新增技能或改进现有技能）
        - 预设
        - 通用改进（应该提到上游）
        - 其他
    validations:
      required: true

  - type: textarea
    id: standard
    attributes:
      label: 有标准依据吗
      description: 如果涉及国标或行标，请写出标准号与条款。国标规则必须以公开标准文本为依据自行实现。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他做法
    validations:
      required: false
